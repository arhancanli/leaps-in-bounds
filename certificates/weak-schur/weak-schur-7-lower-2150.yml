notes: >-
  A weak Schur partition of [1, 2150] into 7 sets: Rowley's first construction (rowley-2020, Theorem 1:
  WS(k+1) >= 4 S(k) + 2) applied to Chen, Zhu and Long's partition of [1, 537] into 6 sum-free sets (arXiv:2610.31362,
  ancillary file solutions537.txt, partition F1.001). T_i = {4i - 1, 4i, 4i + 1} takes the colour of i for i in
  [1, 537], and {1, 2, 6, 10, ..., 2150} is the seventh colour. This improves the published WS(7) >= 2146 (Rowley,
  from S(6) >= 536). Built by our own script and checked by three programs of our own (a bitset test over each colour
  class, a C double loop over all pairs, and a plain Python scan of every x + y = z with x != y), written by an AI agent
  (Claude, Anthropic) for Quantavane; each rejects a copy with one number recoloured.
