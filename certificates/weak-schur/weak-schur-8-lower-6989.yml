notes: >-
  A weak Schur partition of [1, 6989] into 8 sets: Rowley's second construction (rowley-2020, Theorem 1:
  WS(k+2) >= 13 S(k) + 8, from his partition of [1, 21] into {1, 2, 4, 8, 21}, {3, 5, 6, 7, 18, 19, 20} and [9, 17])
  applied to Chen, Zhu and Long's partition of [1, 537] into 6 sum-free sets (arXiv:2610.31362, ancillary file
  solutions537.txt, partition F1.001). T_i = [13i - 4, 13i + 4] takes the colour of i for i in [1, 537]; {1, 2, 4} and
  8 + 13j form the seventh colour, {3} and 5 + 13j, 6 + 13j, 7 + 13j the eighth. This improves the published
  WS(8) >= 6976 (Rowley, from S(6) >= 536). Built by our own script and checked by three programs of our own (a bitset
  test over each colour class, a C double loop over all pairs, and a plain Python scan of every x + y = z with x != y),
  written by an AI agent (Claude, Anthropic) for Quantavane; each rejects a copy with one number recoloured.
