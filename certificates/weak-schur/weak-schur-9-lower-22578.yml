notes: >-
  A weak Schur partition of [1, 22578] into 9 sets: the WS-template construction of Ageron, Casteras, Pellerin,
  Portella, Rimmel and Tomasik (ageron-et-al-2021, Theorem 3.17 with their 23-WS-template of width 42 and 4 colours,
  Table 8, and one last number in the first subset, Proposition 3.20: WS(k+3) >= 42 S(k) + 24) applied to Chen, Zhu
  and Long's partition of [1, 537] into 6 sum-free sets (arXiv:2610.31362, ancillary file solutions537.txt, partition
  F1.001, colours in the order of their least elements). With a = 42 and b = 23, x <= 23 takes its template colour;
  for x > 23, with column pi(x) = (x mod 42) + 42 if x mod 42 <= 23 and x mod 42 otherwise, and row
  lambda(x) = 1 + floor((x - 24) / 42), x takes the template colour of pi(x) when that is one of the three regular
  colours, and otherwise colour 3 + c, where c is the colour of lambda(x) in the 537-partition; 22578 joins the first
  colour. This improves the published WS(9) >= 22536 (Ageron et al., from S(6) >= 536). Built by our own script and
  checked by three programs of our own (a bitset test over each colour class, a C double loop over all pairs, and a
  plain Python scan of every x + y = z with x != y), written by an AI agent (Claude, Anthropic) for Quantavane; each
  rejects a copy with 1 + 2 = 3 made monochromatic and a copy with 18089 recoloured to complete 7717 + 10372.
